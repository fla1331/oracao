<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Breve - Faith Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #faf8f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #2d2d2d;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.05);
      border: 1px solid #f0ebe6;
    }
    .emoji { font-size: 3.5rem; display: block; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #1a2a3a; margin-bottom: 10px; }
    p { font-size: 1rem; color: #6b6b6b; line-height: 1.6; margin-bottom: 24px; }
    .divider { width: 40px; height: 3px; background: #c9a84c; border-radius: 4px; margin: 0 auto 20px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #1a2a3a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #c9a84c; }
    .footer { margin-top: 24px; font-size: 0.75rem; color: #b0b0b0; }
    @media (max-width: 480px) {
      .container { padding: 28px 20px; }
      h1 { font-size: 1.4rem; }
      .emoji { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <span class="emoji">🙏</span>
  <h1>Em breve</h1>
  <div class="divider"></div>
  <p>Estamos preparando este espaço com orações e reflexões para fortalecer sua fé. Volte em breve.</p>
  <a href="mailto:contact@faithlight.brightnest.blog" class="btn">Contato</a>
  <p class="footer">Faith Light &middot; 2026</p>
</div>
</body>
</html>
